<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- the approaching side of the disk is brighter (Doppler beaming) -->
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#bfe4ff"/>
      <stop offset=".75" stop-color="#3a86ff"/>
      <stop offset="1" stop-color="#1d4fb8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset=".45" stop-color="#2f7dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2f7dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#02040b"/>
  <circle cx="32" cy="33" r="24" fill="url(#glow)"/>
  <g transform="rotate(-10 32 33)" fill="none" stroke-linecap="round">
    <!-- the far side of the disk, lensed up and over the shadow -->
    <path d="M17.07 28.83a15.5 15.5 0 0 1 29.86 0" stroke="url(#disk)" stroke-width="3.4" stroke-linecap="butt"/>
    <path d="M5 33a27 5 0 0 1 54 0" stroke="url(#disk)" stroke-width="2" stroke-opacity=".75"/>
    <circle cx="32" cy="33" r="10.5" fill="#000" stroke="#dff3ff" stroke-width="1.2"/>
    <!-- the near side of the disk, in front of the shadow -->
    <path d="M5 33a27 5 0 0 0 54 0" stroke="url(#disk)" stroke-width="3"/>
  </g>
</svg>
